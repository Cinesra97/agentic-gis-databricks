[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 50
# Serves ./static at /app/static (vendored Leaflet assets for offline maps)
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
